<div class="space-y-6">
  <div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 shadow-sm">
    <h1 class="text-3xl font-semibold text-slate-900">{{ 'productDetail.title' | translate }}</h1>
    <p class="mt-2 text-sm text-slate-600">{{ 'productDetail.description' | translate:{ name: product?.name } }}</p>
  </div>

  <div class="grid gap-6 lg:grid-cols-2">
    <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-2xl font-semibold text-slate-900">{{ product?.name }}</h2>
      <p class="mt-3 text-sm text-slate-600">{{ 'productDetail.price' | translate }}: ${{ product?.price }}</p>
    </div>
    <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-slate-600">{{ 'productDetail.info' | translate }}</p>
      <div class="mt-5">
        <button
          class="rounded-xl bg-slate-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-900"
          (click)="backToList()"
        >
          {{ 'productDetail.back' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
