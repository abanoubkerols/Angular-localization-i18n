<div class="space-y-6">
  <div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 shadow-sm">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-semibold text-slate-900">{{ 'products.title' | translate }}</h1>
        <p class="mt-2 text-sm text-slate-600">{{ 'products.description' | translate }}</p>
      </div>
      <app-form-input
        id="product-search"
        [value]="search"
        (valueChange)="search = $event"
      ></app-form-input>
    </div>
  </div>

  <div class="grid gap-6 lg:grid-cols-3">
    <div
      *ngFor="let product of filteredProducts"
      class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"
    >
      <h2 class="text-xl font-semibold text-slate-900">{{ product.name }}</h2>
      <p class="mt-3 text-sm text-slate-600">{{ 'products.detailHint' | translate }}</p>
      <p class="mt-4 text-lg font-semibold text-slate-900">${{ product.price }}</p>
      <div class="mt-5">
        <button
          class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-700"
          (click)="navigateToProduct(product)"
        >
          {{ 'nav.products' | translate }}
        </button>
      </div>
    </div>
  </div>

  <p class="text-sm text-slate-500">
    {{ 'products.count' | translate:{ count: filteredProducts.length } }}
  </p>
</div>
